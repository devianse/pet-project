<!doctype html>
<html lang="en">
  <head>
    <!-- Same-origin file, not inline — see theme-init.js's own comment for
         why (CSP's default-src 'self' silently blocks inline scripts in
         production, so this must not be inline). Runs synchronously
         before paint, so the correct theme is applied with zero flash. -->
    <script src="/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
